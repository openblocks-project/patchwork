# Publishes merged submissions: generates the artifacts of new versions,
# commits them, then generates index.json with every new version pinned to
# that commit, and pushes both commits to the `catalogue` branch.
#
# Lives on the `catalogue` branch (an orphan branch of the Patchwork
# repository). Push workflows come from the pushed commit, so only this
# branch's workflows run here; the application's workflows never do.
#
# Security:
# - Runs only for pushes to `catalogue` (after review and merge), never for
#   pull requests, and writes only to `catalogue`.
# - There is no manual trigger: GitHub offers manual runs only for workflows
#   on the default branch. To retry, re-run the latest Publish run; it
#   checks out the current `catalogue` tip.
# - The validator is built from vars.PATCHWORK_REPOSITORY at
#   vars.PATCHWORK_COMMIT. Nothing in the catalogue is executed; packages are
#   only read as JSON.
# - Everything is validated again here (published history, artifacts that
#   must rebuild to exactly their bytes, the whole catalogue).
# - Pushing uses a deploy key (secret CATALOGUE_DEPLOY_KEY) that the branch
#   rules allow to bypass pull requests. Secrets are never available to
#   pull-request workflows. The job token is read-only.
# - Runs are serialized; a push that lost a race fails and is retried by the
#   next run or a re-run (both commands are idempotent).
name: Publish

on:
  push:
    branches: [catalogue]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish catalogue
    if: github.ref == 'refs/heads/catalogue'
    runs-on: windows-2022
    timeout-minutes: 90
    environment: publish
    env:
      CMAKE_GENERATOR: "Visual Studio 17 2022"
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      CMAKE_MSVC_RUNTIME_LIBRARY: "MultiThreadedDLL"
      RUSTFLAGS: "-C target-feature=-crt-static"
      CARGO_TERM_COLOR: always
    steps:
      - name: Keep exact bytes (no line-ending conversion)
        shell: bash
        run: git config --global core.autocrlf false

      - name: Require the validator configuration
        shell: bash
        env:
          PATCHWORK_REPOSITORY: ${{ vars.PATCHWORK_REPOSITORY }}
          PATCHWORK_COMMIT: ${{ vars.PATCHWORK_COMMIT }}
        run: |
          set -euo pipefail
          if [[ -z "$PATCHWORK_REPOSITORY" || ! "$PATCHWORK_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::repository variables PATCHWORK_REPOSITORY and PATCHWORK_COMMIT (full 40-character hash) must be set"
            exit 1
          fi

      - name: Check out the catalogue (with the deploy key)
        uses: actions/checkout@v4
        with:
          path: catalogue
          ref: ${{ github.ref }}
          ssh-key: ${{ secrets.CATALOGUE_DEPLOY_KEY }}

      - name: Check out the validator (Patchwork at a reviewed commit)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PATCHWORK_REPOSITORY }}
          ref: ${{ vars.PATCHWORK_COMMIT }}
          path: patchwork
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: patchwork

      - name: Configure CMake compatibility
        shell: pwsh
        run: '"CMAKE_ARGS=-DCMAKE_POLICY_VERSION_MINIMUM=3.5" >> $env:GITHUB_ENV'

      - name: Build the validator
        shell: bash
        run: cargo build --release --locked --manifest-path patchwork/Cargo.toml

      - name: Validate, generate and push
        shell: bash
        env:
          BRANCH: catalogue
        run: |
          set -euo pipefail
          tool="$PWD/patchwork/target/release/patchwork.exe"
          repo=(--root . --repository "$GITHUB_REPOSITORY" --branch "$BRANCH")
          cd catalogue
          git config user.name "patchwork-catalogue[bot]"
          git config user.email "patchwork-catalogue-bot@users.noreply.github.com"

          "$tool" catalogue validate "${repo[@]}"

          # 1. Artifacts of new versions (existing ones must rebuild identically).
          "$tool" catalogue publish-artifacts "${repo[@]}"
          if [[ -n "$(git status --porcelain -- artifacts)" ]]; then
            git add -- artifacts
            git commit -m "Publish artifacts for ${GITHUB_SHA}"
          fi

          # Every generated artifact must be in that commit (nothing ignored
          # or left untracked), or the index would pin a missing file.
          if [[ -n "$(git status --porcelain --ignored -- artifacts)" ]]; then
            git status --porcelain --ignored -- artifacts
            echo "::error::artifacts not committed"; exit 1
          fi

          # 2. The index, with new versions pinned to the commit that holds
          #    their artifacts (published versions keep their pins).
          commit="$(git rev-parse HEAD)"
          generated_at="$(git log -1 --format=%ct HEAD)"
          "$tool" catalogue publish-index "${repo[@]}" \
            --commit "$commit" --generated-at "$generated_at"
          if [[ -n "$(git status --porcelain -- index.json)" ]]; then
            git add -- index.json
            git commit -m "Publish index for ${commit}"
          fi

          # Only what was generated may have changed.
          if [[ -n "$(git status --porcelain --ignored)" ]]; then
            git status --porcelain --ignored
            echo "::error::unexpected changes"; exit 1
          fi
          git push origin "HEAD:refs/heads/${BRANCH}"
