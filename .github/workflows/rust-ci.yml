
name: Patchwork Rust CI

on:
  push:
    branches:
      - main
      - feature/p2-p6-architecture

  pull_request:
    branches:
      - main
      - feature/p2-p6-architecture

permissions:
  contents: read

jobs:
  build-and-test:
    name: Windows Build and Tests
    runs-on: windows-2022

    env:
      CMAKE_GENERATOR: "Visual Studio 17 2022"
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      CMAKE_MSVC_RUNTIME_LIBRARY: "MultiThreadedDLL"
      CMAKE_C_FLAGS_DEBUG: "/MD /Zi /Ob0 /Od"
      CMAKE_CXX_FLAGS_DEBUG: "/MD /Zi /Ob0 /Od"
      RUSTFLAGS: "-C target-feature=-crt-static"
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Configure CMake compatibility
        shell: pwsh
        run: |
          cmake --version
          "CMAKE_ARGS=-DCMAKE_POLICY_VERSION_MINIMUM=3.5" >> $env:GITHUB_ENV

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Prepare ONNX Runtime DLL directories
        shell: pwsh
        run: |
          $directories = @(
            "target/debug",
            "target/debug/examples",
            "target/debug/deps"
          )

          foreach ($directory in $directories) {
            New-Item -ItemType Directory -Force -Path $directory | Out-Null
            Write-Host "Prepared: $directory"
          }

      - name: Inspect native dependencies
        shell: pwsh
        run: |
          Write-Host "Checking native dependency files"

          $files = @(
            "vendor/windows/DirectML.dll",
            "vendor/windows/onnxruntime.dll",
            "vendor/windows/onnxruntime_providers_shared.dll"
          )

          foreach ($file in $files) {
            if (Test-Path $file) {
              Write-Host "FOUND: $file"
            } else {
              Write-Host "MISSING: $file"
            }
          }

      - name: Check compilation
        run: cargo check --locked

      - name: Prepare Pico UF2 test firmware
        shell: pwsh
        run: |
          $firmware = Join-Path $env:TEMP "patchwork_test_rp2040.uf2"

          $bytes = [byte[]]::new(512)

          # Write unsigned 32-bit UF2 values
          function Write-UF2Word {
            param(
              [int]$Offset,
              [string]$HexValue
            )

            $value = [Convert]::ToUInt32($HexValue, 16)
            $wordBytes = [BitConverter]::GetBytes($value)

            [Array]::Copy($wordBytes, 0, $bytes, $Offset, 4)
          }

          # UF2 header
          Write-UF2Word 0   "0A324655"
          Write-UF2Word 4   "9E5D5157"
          Write-UF2Word 8   "00002000"
          Write-UF2Word 12  "10000000"
          Write-UF2Word 16  "00000100"
          Write-UF2Word 20  "00000000"
          Write-UF2Word 24  "00000001"
          Write-UF2Word 28  "E48BFF56"

          # UF2 end magic
          Write-UF2Word 508 "0AB16F30"

          [System.IO.File]::WriteAllBytes($firmware, $bytes)

          Write-Host "Created Pico UF2 test fixture: $firmware"
          Write-Host "File size: $((Get-Item $firmware).Length) bytes"

          if ((Get-Item $firmware).Length -ne 512) {
            throw "Invalid UF2 test fixture size"
          }

      - name: Run tests
        run: cargo test --release --locked
