
name: Patchwork Rust CI

on:
  push:
    branches:
      - main
      - feature/p2-p6-architecture

  pull_request:
    branches:
      - main
      - feature/p2-p6-architecture

permissions:
  contents: read

jobs:
  build-and-test:
    name: Windows Build and Tests
    runs-on: windows-2022

    env:
      CMAKE_GENERATOR: "Visual Studio 17 2022"
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      CMAKE_MSVC_RUNTIME_LIBRARY: "MultiThreadedDLL"
      CMAKE_C_FLAGS_DEBUG: "/MD /Zi /Ob0 /Od"
      CMAKE_CXX_FLAGS_DEBUG: "/MD /Zi /Ob0 /Od"
      RUSTFLAGS: "-C target-feature=-crt-static"
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Configure CMake compatibility
        shell: pwsh
        run: |
          cmake --version
          "CMAKE_ARGS=-DCMAKE_POLICY_VERSION_MINIMUM=3.5" >> $env:GITHUB_ENV

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Prepare ONNX Runtime DLL directories
        shell: pwsh
        run: |
          $directories = @(
            "target/debug",
            "target/debug/examples",
            "target/debug/deps"
          )

          foreach ($directory in $directories) {
            New-Item -ItemType Directory -Force -Path $directory | Out-Null
            Write-Host "Prepared: $directory"
          }

      - name: Inspect native dependencies
        shell: pwsh
        run: |
          Write-Host "Checking native dependency files"

          $files = @(
            "vendor/windows/DirectML.dll",
            "vendor/windows/onnxruntime.dll",
            "vendor/windows/onnxruntime_providers_shared.dll"
          )

          foreach ($file in $files) {
            if (Test-Path $file) {
              Write-Host "FOUND: $file"
            } else {
              Write-Host "MISSING: $file"
            }
          }

      - name: Check compilation
        run: cargo check --locked

      - name: Prepare Pico UF2 test firmware
        shell: pwsh
        run: |
          $firmware = Join-Path $env:TEMP "patchwork_test_rp2040.uf2"

          $bytes = [byte[]]::new(512)

          # UF2 magic numbers
          [BitConverter]::GetBytes([uint32]0x0A324655).CopyTo($bytes, 0)
          [BitConverter]::GetBytes([uint32]0x9E5D5157).CopyTo($bytes, 4)
          [BitConverter]::GetBytes([uint32]0x00002000).CopyTo($bytes, 8)
          [BitConverter]::GetBytes([uint32]0x10000000).CopyTo($bytes, 12)
          [BitConverter]::GetBytes([uint32]256).CopyTo($bytes, 16)
          [BitConverter]::GetBytes([uint32]0).CopyTo($bytes, 20)
          [BitConverter]::GetBytes([uint32]1).CopyTo($bytes, 24)
          [BitConverter]::GetBytes([uint32]0xE48BFF56).CopyTo($bytes, 28)
          [BitConverter]::GetBytes([uint32]0x0AB16F30).CopyTo($bytes, 508)

          [System.IO.File]::WriteAllBytes($firmware, $bytes)

          Write-Host "Created Pico UF2 test fixture: $firmware"
          Write-Host "File size: $((Get-Item $firmware).Length) bytes"

      - name: Run tests
        run: cargo test --release --locked
